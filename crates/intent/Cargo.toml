[package]
name = "intent"
version = "0.2.0"
edition = "2021"
description = "Deterministic checks, graph extraction and semantic review for an Intent corpus"

[[bin]]
name = "intent"
path = "src/main.rs"

[lib]
name = "intent"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env", "string"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
ai-gateway = { git = "https://github.com/overengineeringstudio/effect-utils", rev = "61cdf616db95c56fd016b1b78d6dc3010fd83f3c" }
jsonschema = { version = "=0.58.6", default-features = false }
tokio = { version = "1", features = ["rt", "time"] }
# Runtime, not just tests: `review` stages the diagnostics packet and the CAIC
# workspace in scratch directories (lib.rs:366,417,560). Reached fully qualified,
# which is why it is absent from the `use` block at the top of the module.
tempfile = "3.10"

[dev-dependencies]
axum = "0.8"
parking_lot = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "process"] }
