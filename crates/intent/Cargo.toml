[package]
name = "intent"
version = "0.1.0"
edition = "2021"
description = "Deterministic checks, graph extraction and semantic review for a VRS corpus"

[[bin]]
name = "intent"
path = "src/main.rs"

[lib]
name = "intent"
path = "src/lib.rs"

[dependencies]
# `string` carries its weight: the corpus defaults are supplied by the embedding
# caller at runtime, and without it `default_value` accepts only `&'static` values —
# which is what forced those defaults out of the command tree and off `--help`.
clap = { version = "4.5", features = ["derive", "env", "string"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Runtime, not just tests: `review` stages the diagnostics packet and the CAIC
# workspace in scratch directories (lib.rs:366,417,560). Reached fully qualified,
# which is why it is absent from the `use` block at the top of the module.
tempfile = "3.10"
